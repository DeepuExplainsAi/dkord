name: Validate pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Validation only: no signing secrets, release writes or published/installer APK artifacts.
permissions:
  contents: read

concurrency:
  group: pr-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and APK compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run the full Android unit suite and build the APK
        id: android_build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/dkord-android-build.log"
      - name: Surface Android compiler diagnostics
        if: always()
        run: python3 -B .github/scripts/annotate_android_build.py "$RUNNER_TEMP/dkord-android-build.log"
      - name: Summarize executed Android tests
        if: always()
        env:
          ANDROID_BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_ANDROID_CLASSES: app.dkord.DesktopRoomInteropTest
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
              for case in suite.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      detail = (failure.attrib.get('message') or failure.text or '').splitlines()[0:1]
                      message = f"{case.attrib.get('classname', suite.attrib.get('name', ''))}.{case.attrib.get('name', '')}: {' '.join(detail)[:600]}"
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Android JUnit failure::' + message)
          classes={case.attrib.get('classname','') for report in reports for case in ET.parse(report).getroot().findall('testcase')}
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          if reports:
              message = (f"{totals['tests']} JUnit test cases: {passed} passed, "
                         f"{totals['failures']} failed, {totals['errors']} errors, {totals['skipped']} skipped "
                         f"({len(reports)} JUnit XML reports).")
          else:
              message = 'No Android unit-test reports generated; Android validation is not established.'
          print('::notice title=Android unit tests::' + message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Android validation\n\n' + message + '\n\n')
              summary.write(f"PR head: `{os.environ['PR_HEAD_SHA']}`\n\n")
              summary.write(f"Checked merge commit: `{os.environ['GITHUB_SHA']}`\n\n")
              summary.write('Validation only. No release/tag or installable APK artifact is published. '
                            'Official updates still require the manual Release APK signing/install-over gates.\n')
          missing=set(os.environ.get('REQUIRED_ANDROID_CLASSES','').split())-classes
          if os.environ.get('ANDROID_BUILD_OUTCOME') == 'success' and missing:
              raise SystemExit('Missing required Android classes: '+', '.join(sorted(missing)))
          if os.environ.get('ANDROID_BUILD_OUTCOME') == 'success' and (
                  not reports or passed <= 0 or totals['failures'] or totals['errors']):
              raise SystemExit('A successful Android build must have real passing JUnit reports and no failed tests.')
          PY
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  keyboard-layout:
    name: Android keyboard and real audio tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build device test APKs before starting the memory-heavy emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-parallel --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android IME and layout regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            export GRADLE_OPTS='-Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"'
            bash .github/scripts/prepare_emulator_ime.sh
            bash .github/scripts/prepare_emulator_home.sh
            bash -o pipefail -c './gradlew connectedDebugAndroidTest --stacktrace --no-parallel --max-workers=2 2>&1 | tee -a "$RUNNER_TEMP/dkord-device-build.log"'
      - name: Surface Android device-build diagnostics
        if: always()
        run: python3 -B .github/scripts/annotate_android_build.py "$RUNNER_TEMP/dkord-device-build.log"
      - name: Summarize executed device regressions
        if: always()
        run: >-
          python3 -B .github/scripts/summarize_device_tests.py
          --required-class app.dkord.SearchKeyboardViewportTest
          --required-class app.dkord.StudioAudioExportTest
          --required-class app.dkord.StudioClipEditorTest
          --required-class app.dkord.StudioExportPublicationTest
          --required-class app.dkord.ListenAgainTest
          --required-class app.dkord.RelatedPlaybackRoutingTest
          --required-class app.dkord.OnlineStudioAndStorageTest
          --required-class app.dkord.DownloadDestinationTest
          --required-class app.dkord.StudioSongPickerTest
          --required-class app.dkord.RoomCoHostTest
          --required-class app.dkord.AppPresentationTest
          --required-class app.dkord.InstallOverPersistenceTest
      - name: Upload Android device-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
