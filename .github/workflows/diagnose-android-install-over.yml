name: Read the failed Android install-over diagnostic
on:
  push:
    branches: [arena/a6a6bbda-dkord]
    paths: [.github/workflows/diagnose-android-install-over.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'DeepuExplainsAi/dkord' && github.ref == 'refs/heads/arena/a6a6bbda-dkord'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Surface only the failed isolated upgrade step from the fixed publication run
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['gh', 'run', 'view', '42576142960', '--repo', 'DeepuExplainsAi/dkord',
                                   '--job', '129024183261', '--log-failed'], capture_output=True, text=True, check=True, timeout=180)
          step = 'Actually install the original APK then install-over and verify its real data and downloads'
          lines = [line.split('\t', 2)[-1] for line in result.stdout.splitlines() if '\t' + step + '\t' in line]
          assert lines, 'The fixed failed upgrade step log was not returned'
          # Already-masked public CI output from this one post-keystore-removal step only.
          # No signing-step output, private signing material or unrelated job logs.
          text = '\n'.join(lines[-140:])[-24000:]
          for index, start in enumerate(range(0, len(text), 8000), 1):
              piece = text[start:start + 8000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Prior Android install-over failure part {index}::' + piece)
