name: Validate native desktop previews
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'desktop/**'
      - '.github/workflows/validate-desktop.yml'
      - '.github/scripts/test_desktop_contracts.py'
permissions:
  contents: read
concurrency:
  group: pr-desktop-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native ${{ matrix.target }} preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: desktop
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
      DKORD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ contains(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          architecture: ${{ contains(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      - name: Install native Linux desktop/audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libpulse0 libasound2t64 libx11-xcb1 fonts-noto-core
      - name: Install locked native runtime and packaging dependencies
        run: python -m pip install -r desktop/requirements-build.txt -c desktop/constraints.lock
      - name: Execute real codec, data, updater and native Qt widget tests
        run: python -m pytest desktop/tests -v --junitxml=desktop/.artifacts/test-results.xml
      - name: Check all required native tests actually ran without skips
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse('desktop/.artifacts/test-results.xml').getroot()
          cases = root.findall('.//testcase')
          for cls in ('CoreTest', 'UpdateTest', 'NativeWidgetTest'):
              assert any(cls in c.attrib.get('classname', '') for c in cases), f'Missing {cls}'
          assert len(cases) >= 26, f'Only {len(cases)} desktop cases'
          assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped')
          print(f'::notice title=Native desktop tests::{len(cases)} cases passed; all3 classes; no failures/errors/skips.')
          PY
      - name: Native app entry-point smoke
        run: python -m dkord_desktop --self-test
      - name: Build and execute the real native package
        run: python desktop/packaging/build.py --target ${{ matrix.target }}
      - name: Upload development packages, hashes and test proof (not a signed public release)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-preview-${{ matrix.target }}
          retention-days: 3
          if-no-files-found: error
          path: |
            desktop/.artifacts/Dkord-desktop-*.exe
            desktop/.artifacts/Dkord-desktop-*.pkg
            desktop/.artifacts/Dkord-desktop-*.deb
            desktop/.artifacts/Dkord-desktop-*.AppImage
            desktop/.artifacts/preview-*.json
            desktop/.artifacts/test-results.xml
