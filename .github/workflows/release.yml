name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching app versionName (for example v0.9.0)'
        required: true
        type: string

  # One explicit owner-authorized release request, never ordinary PR/code pushes.
  push:
    branches: [arena/59a2f745-dkord]
    paths: [.github/release-requests/v0.9.0.json]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || 'v0.9.0' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || 'v0.9.0' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the explicit trusted-branch release request
        if: github.event_name == 'push'
        run: python3 -B .github/scripts/validate_release_request.py
      - name: Validate release tag against app version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              sys.exit('Could not read versionName from app/build.gradle.kts')
          expected = 'v' + match.group(1)
          if os.environ['TAG'] != expected:
              sys.exit('Release tag must match app versionName: expected ' + expected)
          print('Release tag matches app versionName: ' + expected)
          PY
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Require the existing stable signing key
        env:
          KS: ${{ secrets.DKORD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DKORD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Existing stable signing secrets are required. Refusing to publish a default-debug-key APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dkord.p12"
          printf '%s' "$KS" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -storetype pkcs12 -keystore "$keystore" -alias dkord -storepass:env KS_PASS > /dev/null
          delimiter="DKORD_PASS_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'DKORD_KEYSTORE=%s\n' "$keystore"
            printf 'DKORD_KEYSTORE_PASS<<%s\n' "$delimiter"
            printf '%s\n' "$KS_PASS"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Run the full Android unit suite and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify and prepare release APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]}" ]; then
            echo "Expected exactly one nonempty debug APK after successful tests and build."
            exit 1
          fi
          release_apk="$RUNNER_TEMP/Dkord-${TAG}.apk"
          cp -- "${apks[0]}" "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Verify install-over compatibility with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$previous_tag" = "$TAG" ]; then
            echo "::error::This version is already the latest release. Refusing to overwrite it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          python3 -B .github/scripts/verify_apk_update.py
      - name: Create latest release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Dkord %s\n\n' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## New in v0.9.0
          - Search keyboard/insets repair: one app-shell IME owner, consumed nested padding and keyboard-aware bottom controls avoid duplicate reserved space. Submit, keyboard Search, clear, history, suggestions and explicit search scopes are preserved.
          - Genuine Shorts: native provider videos in a vertical feed, paged creator Shorts discovery, one active clip player and lifecycle/headset cleanup. Find full song opens an editable Songs lookup; choose the matching song explicitly. Original-song attribution is not verified and a guessed first result is never silently played.
          - Real Mashup Studio: open from Library or a song menu, import readable non-DRM phone audio or completed Dkord downloads, choose arbitrary valid millisecond start/end or duration ranges, reuse sources, reorder/remove clips and preview.
          - Merge produces one actual playable AAC/M4A file on-device, not a queue or playlist. Persistent projects, frozen export inputs, foreground progress/cancel and incomplete-output cleanup are included. Saved audio supports playback, playlists, file sharing and Save a copy.
          - English/Hindi UI and a keyboard-safe editor footer with owner language/accessibility font inheritance. Private project inputs are not exposed by audio sharing; generated local tracks do not fall through to remote stream/radio/lyrics/video or room lookup.
          - Existing selected-song-first playback, guarded diverse radio, downloads, recents/pins, rooms, settings, visible Choliwood naming and original signing/update safety are retained. No global colour/theme replacement.

          ## Validation and limits
          The application source passed 300 JVM tests and all 9 real Android device regressions, including actual mixed-format AAC decode/range/order, cancellation, persistence, foreground saved-output registration and English/Hindi real-keyboard editor layout. These tests do not establish full Search-screen/physical-phone/OEM/live-provider acceptance. Provider/account/region/format restrictions and device codec/storage limits still apply; original-song links are not guaranteed. Only accessible non-DRM audio is supported. External document-provider failure can leave a partial user-selected Save-copy document; arbitrary user documents are never deleted automatically.

          Install **Dkord-v0.9.0.apk** over your existing Dkord app, without uninstalling, to retain playlists, likes, downloads and settings. Same app.dkord package and original signing key; versionCode12 increases from v0.8.2/code11. The release pipeline checks actual old/new APK package/signatures/version compatibility before publication. PR #7 is not merged by this release.
          NOTES
          gh release create "$TAG" "$RELEASE_APK" --latest --target "$GITHUB_SHA" \
            --title "Dkord ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
