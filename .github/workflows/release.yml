name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching app versionName (for example v0.9.1)'
        required: true
        type: string

  # One explicit owner-authorized release request, never ordinary PR/code pushes.
  push:
    branches: [arena/59a2f745-dkord]
    paths: [.github/release-requests/v0.9.1.json]

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release-${{ inputs.tag || 'v0.9.1' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || 'v0.9.1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the explicit trusted-branch release request
        if: github.event_name == 'push'
        run: python3 -B .github/scripts/validate_release_request.py
      - name: Validate release tag against app version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              sys.exit('Could not read versionName from app/build.gradle.kts')
          expected = 'v' + match.group(1)
          if os.environ['TAG'] != expected:
              sys.exit('Release tag must match app versionName: expected ' + expected)
          print('Release tag matches app versionName: ' + expected)
          PY
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Require the existing stable signing key
        env:
          KS: ${{ secrets.DKORD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DKORD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Existing stable signing secrets are required. Refusing to publish a default-debug-key APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dkord.p12"
          printf '%s' "$KS" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -storetype pkcs12 -keystore "$keystore" -alias dkord -storepass:env KS_PASS > /dev/null
          delimiter="DKORD_PASS_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'DKORD_KEYSTORE=%s\n' "$keystore"
            printf 'DKORD_KEYSTORE_PASS<<%s\n' "$delimiter"
            printf '%s\n' "$KS_PASS"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Run the full Android unit suite and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify and prepare release APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]}" ]; then
            echo "Expected exactly one nonempty debug APK after successful tests and build."
            exit 1
          fi
          release_apk="$RUNNER_TEMP/Dkord-${TAG}.apk"
          cp -- "${apks[0]}" "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Verify install-over compatibility with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$previous_tag" = "$TAG" ]; then
            echo "::error::This version is already the latest release. Refusing to overwrite it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          python3 -B .github/scripts/verify_apk_update.py
      - name: Require successful full Android validation of this exact release head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validation_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pr.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=pull_request -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ ! "$validation_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No matching-head PR validation found. Refusing to publish without full Android/device validation."
            exit 1
          fi
          gh run watch "$validation_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Create latest release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Dkord %s\n\n' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## New in v0.9.1
          - Shorts/Reels removed completely. The replacement Listen / Listen Again tab is audio-first: resume the actual saved/current song and queue at its position, search real local listening history, browse real dates, and filter liked or completed-download history.
          - Individual history rows play the chosen song; Play these songs is a separate full-list action. History management removes only history entries, not songs, likes, playlists, downloads, exported files or the current queue. Existing saved Shorts tabs migrate directly to Listen.
          - Search and ordinary Home song taps start the exact selected song, then use one pinned selection context for related anonymous music radio across batches. Known language/mood/era incompatibilities are filtered before shared-style, genuine provider-view and provider-rank relevance; broad artist-only fallback and uninspected filler are removed.
          - Same-song/base-song/version and long-mix guards remain. Pause, sleep, Autoplay-off, repeat, rapid selection and manual queue edits retain cancellation/result-time ownership protections: no stale append or forced resume.
          - Home has a separate accessible English/Hindi Play all action. Explicit playlist/album/category/New Releases full-shelf playback remains intact; New Releases stays collapsed by default and visible Choliwood naming is retained.
          - Completed Search submissions/provider corrections and owned Home chip/page responses supply session-private recommendation intent; typing and stale requests cannot change it. Private intent is not persisted or sent in Track, MediaItem or room metadata.
          - Preserve the keyboard/footer repairs, English-default/explicit Hindi interface, downloads, Library, metadata-only rooms, optional ordinary song video/link search and real on-device Mashup Studio from v0.9.0. No replacement colour/theme or account/cookie login is added.

          ## Validation and limits
          Publication requires fresh full Android validation on this exact release head: APK compile, 378 JVM tests and all 19 real Android emulator cases, including Search keyboard/viewport/navigation, Hindi large-font Listen search, related-routing, Studio editor, decoded audio/export/cancellation and saved-output publication checks, without skips. The signed pipeline also reruns the full unit suite and verifies the actual previous/new APK package, signing certificates and increasing version code before publication. Python/source checks are additional guards, not substitutes for Android execution.

          Related autoplay is best-effort metadata/context matching, not account-personalized YouTube Music AI or acoustic mood recognition. Unknown or provider-mislabeled language/mood/era can limit quality; weak/offline evidence can produce fewer recommendations rather than invented songs or unrelated padding. Live-provider similarity, physical-phone/OEM behavior and phone update/data-retention smoke remain unverified. Previous intermittent CI Window-focus failures have diagnostic coverage; their underlying cause is not claimed permanently fixed. Existing provider/account/region, readable non-DRM audio, codec/storage and document-provider limits still apply.

          Install **Dkord-v0.9.1.apk** over the existing Dkord app, **without uninstalling or resetting data**. It keeps app.dkord and the original signing key; versionCode13 increases from v0.9.0/code12. Existing binary install-over compatibility gates are mandatory, not a claim of a completed physical-phone install. Previous releases are preserved. PR #7 remains unmerged; this release does not merge main.
          NOTES
          gh release create "$TAG" "$RELEASE_APK" --latest --target "$GITHUB_SHA" \
            --title "Dkord ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
