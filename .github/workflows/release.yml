name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching app versionName (for example v0.8.2)'
        required: true
        type: string

  # One explicit owner-authorized release request, never ordinary PR/code pushes.
  push:
    branches: [arena/59a2f745-dkord]
    paths: [.github/release-requests/v0.8.2.json]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || 'v0.8.2' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || 'v0.8.2' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the explicit trusted-branch release request
        if: github.event_name == 'push'
        run: python3 -B .github/scripts/validate_release_request.py
      - name: Validate release tag against app version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              sys.exit('Could not read versionName from app/build.gradle.kts')
          expected = 'v' + match.group(1)
          if os.environ['TAG'] != expected:
              sys.exit('Release tag must match app versionName: expected ' + expected)
          print('Release tag matches app versionName: ' + expected)
          PY
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Require the existing stable signing key
        env:
          KS: ${{ secrets.DKORD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DKORD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Existing stable signing secrets are required. Refusing to publish a default-debug-key APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dkord.p12"
          printf '%s' "$KS" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -storetype pkcs12 -keystore "$keystore" -alias dkord -storepass:env KS_PASS > /dev/null
          delimiter="DKORD_PASS_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'DKORD_KEYSTORE=%s\n' "$keystore"
            printf 'DKORD_KEYSTORE_PASS<<%s\n' "$delimiter"
            printf '%s\n' "$KS_PASS"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Run the full Android unit suite and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify and prepare release APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]}" ]; then
            echo "Expected exactly one nonempty debug APK after successful tests and build."
            exit 1
          fi
          release_apk="$RUNNER_TEMP/Dkord-${TAG}.apk"
          cp -- "${apks[0]}" "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Verify install-over compatibility with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$previous_tag" = "$TAG" ]; then
            echo "::error::This version is already the latest release. Refusing to overwrite it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          python3 -B .github/scripts/verify_apk_update.py
      - name: Create latest release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Dkord %s\n\n' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - Emergency search/player hotfix based on the published v0.8.1 source; Songs stays the default and first scope, like the earlier music-first releases. All YouTube / Videos remain explicit options for other uploads.
          - Tapping a search result plays that exact upload first, not every matching original/slowed/cover/hour-mix result. Explicit album, playlist and Home-shelf queues are preserved.
          - Autoplay requests genuinely different related music for the current queue. Same-song versions, already queued tracks, explicit hour-loop/every-version compilations and out-of-range automatic recommendations are excluded without filtering manual search results.
          - Old radio responses cannot append after a new selection, queue edit, disconnect, pause, repeat change or Autoplay-off. Prefetch does not interrupt the selected song; paused/sleep-stopped playback is not deliberately restarted by a late result.
          - Music-radio-first recommendation order is preserved, with music-only search and creator fallback when results are only more versions of the seed; cancellation does not start extra fallback requests.
          - Search has a separate 48dp submit button and compact single-line English/Hindi placeholder, avoiding editable-text/caret overlap. Full-player secondary buttons wrap as whole controls instead of stacking Add to playlist letter-by-letter.
          - Persistent recents/pins, explicit creator-cover/instrumental/long-mix selection, downloads, local playlists, rooms, existing player controls and original signing/update safety gates retained.

          Upstream availability/account/region/format restrictions are not bypassed. Anonymous ordering is not promised to match an account-personalized official app. This release does not include a mashup editor or new Shorts/reel feed.

          Install the APK over your existing Dkord app to keep playlists, likes, downloads and settings (same package and signing key).
          NOTES
          gh release create "$TAG" "$RELEASE_APK" --latest --target "$GITHUB_SHA" \
            --title "Dkord ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
