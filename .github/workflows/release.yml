name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching app versionName (for example v0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag against app version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              sys.exit('Could not read versionName from app/build.gradle.kts')
          expected = 'v' + match.group(1)
          if os.environ['TAG'] != expected:
              sys.exit('Release tag must match app versionName: expected ' + expected)
          print('Release tag matches app versionName: ' + expected)
          PY
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Require the existing stable signing key
        env:
          KS: ${{ secrets.DKORD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DKORD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Existing stable signing secrets are required. Refusing to publish a default-debug-key APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dkord.p12"
          printf '%s' "$KS" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -storetype pkcs12 -keystore "$keystore" -alias dkord -storepass:env KS_PASS > /dev/null
          delimiter="DKORD_PASS_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'DKORD_KEYSTORE=%s\n' "$keystore"
            printf 'DKORD_KEYSTORE_PASS<<%s\n' "$delimiter"
            printf '%s\n' "$KS_PASS"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Run the full Android unit suite and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify and prepare release APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]}" ]; then
            echo "Expected exactly one nonempty debug APK after successful tests and build."
            exit 1
          fi
          release_apk="$RUNNER_TEMP/Dkord-${TAG}.apk"
          cp -- "${apks[0]}" "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Verify install-over compatibility with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$previous_tag" = "$TAG" ]; then
            echo "::error::This version is already the latest release. Refusing to overwrite it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          python3 -B .github/scripts/verify_apk_update.py
      - name: Create latest release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Dkord %s\n\n' "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - Part 1: broader search. New searches default to All on normal YouTube, rather than the music-songs-only catalogue.
          - Separate Videos and Music videos filters, plus the existing Songs / Albums / Artists / Playlists options.
          - Queries are passed through without keyword, genre or duration whitelists. Long mixes, mashups, covers, remixes and other provider results can appear in their original order.
          - Clear separation between saved queries and real YouTube suggestions, with loading / Retry states and preserved provider suggestion order.
          - Provider Did you mean / Showing results for corrections, without silently replacing the user's typed query or search history.
          - A Search all YouTube shortcut for narrow empty/error states, and support for watch / short / Shorts / live / embed video identities including playlist-context watch links.
          - Creator covers, instrumentals, karaoke, piano/no-vocals, Instagram/reel-style and other version queries use the broad YouTube path; no fixed category whitelist or local spelling rewrite. Same-title uploads remain separate by video ID.
          - Clear All YouTube catalogue label and always-visible broad-search escape from narrow filters, even with existing results; two-line result titles and creator + known duration help identify versions.
          - Persistent recents/pins, English / Hindi text, full-list playback and pagination retry retained. Existing music-only autoplay, downloads, rooms and updates are unchanged.

          Search is anonymous, so exact personalized YouTube ordering is not promised. Provider availability, regional, age and playable-format restrictions still apply. Part 2 custom mashup editing/export is not included in this release.

          Install the APK over your existing Dkord app to keep playlists, likes, downloads and settings (same package and signing key).
          NOTES
          gh release create "$TAG" "$RELEASE_APK" --latest --target "$GITHUB_SHA" \
            --title "Dkord ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
