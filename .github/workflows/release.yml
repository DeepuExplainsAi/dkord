name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching app versionName (for example v0.10.0)'
        required: true
        type: string

  # One NEW explicit owner-authorized release request; older requests remain consumed, never ordinary PR/code pushes.
  push:
    branches: [arena/a0209191-dkord]
    paths: [.github/release-requests/v0.10.0.json]

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release-${{ inputs.tag || 'v0.10.0' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || 'v0.10.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Validate the explicit trusted-branch release request
        if: github.event_name == 'push'
        run: python3 -B .github/scripts/validate_release_request_v010.py
      - name: Validate release tag against app version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if not match:
              sys.exit('Could not read versionName from app/build.gradle.kts')
          expected = 'v' + match.group(1)
          if os.environ['TAG'] != expected:
              sys.exit('Release tag must match app versionName: expected ' + expected)
          print('Release tag matches app versionName: ' + expected)
          PY
      - name: Run resource, app-contract and release-guard regressions
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Require the existing stable signing key
        env:
          KS: ${{ secrets.DKORD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DKORD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Existing stable signing secrets are required. Refusing to publish a default-debug-key APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dkord.p12"
          printf '%s' "$KS" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -storetype pkcs12 -keystore "$keystore" -alias dkord -storepass:env KS_PASS > /dev/null
          delimiter="DKORD_PASS_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'DKORD_KEYSTORE=%s\n' "$keystore"
            printf 'DKORD_KEYSTORE_PASS<<%s\n' "$delimiter"
            printf '%s\n' "$KS_PASS"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Run the full Android unit suite and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify and prepare release APK
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -s "${apks[0]}" ]; then
            echo "Expected exactly one nonempty debug APK after successful tests and build."
            exit 1
          fi
          release_apk="$RUNNER_TEMP/Dkord-${TAG}.apk"
          cp -- "${apks[0]}" "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Verify install-over compatibility with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ "$previous_tag" = "$TAG" ]; then
            echo "::error::This version is already the latest release. Refusing to overwrite it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          python3 -B .github/scripts/verify_apk_update.py
      - name: Require successful full Android validation of this exact release head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validation_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pr.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=pull_request -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ ! "$validation_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No matching-head PR validation found. Refusing to publish without full Android/device validation."
            exit 1
          fi
          gh run watch "$validation_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Require the exact-head six-host native preview build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/validate-desktop.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=pull_request -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ ! "$native_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No exact-head native preview run. Refusing to attach old or untested desktop binaries."
            exit 1
          fi
          gh run watch "$native_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          echo "NATIVE_RUN_ID=$native_id" >> "$GITHUB_ENV"
      - name: Download and verify native preview provenance, test reports and actual package hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'desktop-preview-*' --dir "$RUNNER_TEMP/native-previews"
          python3 -B .github/scripts/verify_desktop_release_artifacts.py \
            --root "$RUNNER_TEMP/native-previews" --output "$RUNNER_TEMP/native-release-assets" \
            --sha "$GITHUB_SHA" --version "${TAG#v}"
      - name: Create latest release with APK and explicitly experimental desktop previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing version-specific honest release notes."
            exit 1
          fi
          cp -- "$notes" "$RUNNER_TEMP/release-notes.md"
          printf '\nExact release source: `%s`. [Android validation](https://github.com/%s/actions?query=workflow%%3A%%22Validate+pull+request%%22) · [Native preview proof](https://github.com/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$NATIVE_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          export RELEASE_ASSET_DIR="$RUNNER_TEMP/native-release-assets"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          folder = Path(os.environ['RELEASE_ASSET_DIR'])
          apk = Path(os.environ['RELEASE_APK'])
          files = [apk, *sorted(folder.iterdir())]
          lines = []
          for file in files:
              value = hashlib.sha256()
              with file.open('rb') as source:
                  for block in iter(lambda: source.read(1024*1024), b''):
                      value.update(block)
              lines.append(value.hexdigest() + '  ' + file.name)
          (folder/'SHA256SUMS').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('::notice title=Release SHA-256::' + lines[0])
          PY
          shopt -s nullglob
          assets=("$RUNNER_TEMP/native-release-assets/"*)
          if [ "${#assets[@]}" -ne 15 ]; then
            echo "::error::Expected8 native packages,6 provenance manifests and SHA256SUMS."
            exit 1
          fi
          gh release create "$TAG" "$RELEASE_APK" "${assets[@]}" --latest --target "$GITHUB_SHA" \
            --title "Dkord ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
